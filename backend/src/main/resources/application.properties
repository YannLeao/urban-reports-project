spring.application.name=urban-reports
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
spring.config.import=optional:file:.env[.properties]
# Also resolve the uppercase key when .env is imported as a properties file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${BACKEND_PORT:8080}

spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=6291456B
# Drain rejected requests near the limit so clients can receive the JSON 413.
# Keep this finite: arbitrary oversized bodies may have the connection closed.
server.tomcat.max-swallow-size=7340032B

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urban_reports}}
spring.datasource.username=${DB_USERNAME:urban_reports}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

image.storage.endpoint=${IMAGE_STORAGE_ENDPOINT:}
image.storage.region=${IMAGE_STORAGE_REGION:auto}
image.storage.bucket=${IMAGE_STORAGE_BUCKET:}
image.storage.access-key=${IMAGE_STORAGE_ACCESS_KEY:}
image.storage.secret-key=${IMAGE_STORAGE_SECRET_KEY:}

# Required external RSA keys; never generated by the application.
auth.jwt.issuer=${AUTH_JWT_ISSUER:}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:}
auth.jwt.key-id=${AUTH_JWT_KEY_ID:}
auth.jwt.private-key-file=${AUTH_JWT_PRIVATE_KEY_FILE:}
auth.jwt.public-key-file=${AUTH_JWT_PUBLIC_KEY_FILE:}

# Durable recovery covers only new occurrence uploads. Interval is milliseconds.
image.recovery.enabled=${IMAGE_RECOVERY_ENABLED:true}
image.recovery.interval=${IMAGE_RECOVERY_INTERVAL:60000}
image.recovery.safety-delay=${IMAGE_RECOVERY_SAFETY_DELAY:PT5M}
image.recovery.batch-size=${IMAGE_RECOVERY_BATCH_SIZE:20}

# SMTP is optional at boot. Missing/unavailable configuration yields an honest FAILED invitation result.
admin.frontend-origin=${ADMIN_FRONTEND_ORIGIN:}
admin.mail.from=${ADMIN_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
