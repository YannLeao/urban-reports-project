spring.application.name=urban-reports
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
spring.config.import=optional:file:.env[.properties]
# Also resolve the uppercase key when .env is imported as a properties file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${BACKEND_PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urban_reports}}
spring.datasource.username=${DB_USERNAME:urban_reports}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

image.storage.endpoint=${IMAGE_STORAGE_ENDPOINT:}
image.storage.region=${IMAGE_STORAGE_REGION:auto}
image.storage.bucket=${IMAGE_STORAGE_BUCKET:}
image.storage.access-key=${IMAGE_STORAGE_ACCESS_KEY:}
image.storage.secret-key=${IMAGE_STORAGE_SECRET_KEY:}

# Required external RSA keys; never generated by the application.
auth.jwt.issuer=${AUTH_JWT_ISSUER:}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:}
auth.jwt.key-id=${AUTH_JWT_KEY_ID:}
auth.jwt.private-key-file=${AUTH_JWT_PRIVATE_KEY_FILE:}
auth.jwt.public-key-file=${AUTH_JWT_PUBLIC_KEY_FILE:}
