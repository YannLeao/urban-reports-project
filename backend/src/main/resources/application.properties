spring.application.name=urban-reports
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
spring.config.import=optional:file:.env[.properties]
# Also resolve the uppercase key when .env is imported as a properties file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${BACKEND_PORT:8080}

spring.servlet.multipart.max-file-size=26214400B
spring.servlet.multipart.max-request-size=27262976B
# Drain rejected requests near the limit so clients can receive the JSON 413.
# Keep this finite: arbitrary oversized bodies may have the connection closed.
# NIO uses this finite timeout for socket reads and blocking writes.
server.tomcat.connection-timeout=20s
server.tomcat.max-swallow-size=28311552B
server.tomcat.max-part-count=20
server.tomcat.max-part-header-size=1024
server.tomcat.max-http-form-post-size=65536B
spring.servlet.multipart.file-size-threshold=0B

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urban_reports}}
spring.datasource.username=${DB_USERNAME:urban_reports}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

image.storage.endpoint=${IMAGE_STORAGE_ENDPOINT:}
image.storage.region=${IMAGE_STORAGE_REGION:auto}
image.storage.bucket=${IMAGE_STORAGE_BUCKET:}
image.storage.access-key=${IMAGE_STORAGE_ACCESS_KEY:}
image.storage.secret-key=${IMAGE_STORAGE_SECRET_KEY:}

# Required external RSA keys; never generated by the application.
auth.jwt.issuer=${AUTH_JWT_ISSUER:}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:}
auth.jwt.key-id=${AUTH_JWT_KEY_ID:}
auth.jwt.private-key-file=${AUTH_JWT_PRIVATE_KEY_FILE:}
auth.jwt.public-key-file=${AUTH_JWT_PUBLIC_KEY_FILE:}

# Durable recovery covers only new occurrence uploads. Interval is milliseconds.
image.recovery.enabled=${IMAGE_RECOVERY_ENABLED:true}
image.recovery.interval=${IMAGE_RECOVERY_INTERVAL:60000}
image.recovery.safety-delay=${IMAGE_RECOVERY_SAFETY_DELAY:PT5M}
image.recovery.batch-size=${IMAGE_RECOVERY_BATCH_SIZE:20}

# Email is optional at boot; missing configuration fails before any network call.
admin.frontend-origin=${ADMIN_FRONTEND_ORIGIN:}
email.brevo.api-key=${BREVO_API_KEY:}
email.from=${EMAIL_FROM:}
email.from-name=${EMAIL_FROM_NAME:Alô Cidade}
email.connect-timeout-ms=${EMAIL_CONNECT_TIMEOUT_MS:3000}
email.request-timeout-ms=${EMAIL_REQUEST_TIMEOUT_MS:10000}

# Capture is always transactional in V12; this switch controls consumption only.
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
notifications.email.frontend-origin=${NOTIFICATIONS_FRONTEND_ORIGIN:}
notifications.email.poll-interval-ms=${NOTIFICATIONS_EMAIL_POLL_INTERVAL_MS:60000}
notifications.email.batch-size=${NOTIFICATIONS_EMAIL_BATCH_SIZE:3}
notifications.email.lease-ms=${NOTIFICATIONS_EMAIL_LEASE_MS:60000}

# Dedicated, low-volume email diagnostics; retain Boot's text layout and render key/value fields.
logging.pattern.level=%5p %kvp
logging.level.com.project.software.urbanreports.email.observability=WARN

# Combined probe/frame inspection/decode deadline, constrained to 1–30 seconds.
video.validation.timeout-seconds=${VIDEO_VALIDATION_TIMEOUT_SECONDS:30}
