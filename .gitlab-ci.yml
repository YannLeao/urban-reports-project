stages:
  - build
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/backend/.m2/repository"

# ---------- BACKEND (Java / Maven) ----------

backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-backend
    paths:
      - backend/.m2/repository
  script:
    - cd backend
    - ./mvnw -B compile
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key: maven-backend
    paths:
      - backend/.m2/repository
  needs:
    - backend:build
  script:
    - cd backend
    - ./mvnw -B test
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

# ---------- FRONTEND (React / npm) ----------

frontend:build:
  stage: build
  image: node:20
  cache:
    key: npm-frontend
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm
    - npm run build
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

frontend:lint:
  stage: test
  image: node:20
  cache:
    key: npm-frontend
    paths:
      - frontend/.npm
  needs:
    - frontend:build
  script:
    - cd frontend
    - npm ci --cache .npm
    - npm run lint
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

frontend:pages:
  stage: deploy
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  pages:
    publish: public
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

# ---------- DEPLOY (Render) ----------

backend:deploy:
  stage: deploy
  image: curlimages/curl:8.22.0
  needs:
    - backend:build
    - backend:test
  script:
    - curl --fail --show-error --silent --get --data-urlencode "ref=$CI_COMMIT_SHA" --output /dev/null "$RENDER_DEPLOY_HOOK"
  environment:
    name: production
    url: $BACKEND_PRODUCTION_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: false
