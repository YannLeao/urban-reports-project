stages:
  - build
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---------- BACKEND (Java / Maven) ----------

backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-backend
    paths:
      - backend/.m2/repository
  script:
    - cd backend
    - ./mvnw -B compile

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key: maven-backend
    paths:
      - backend/.m2/repository
  script:
    - cd backend
    - ./mvnw -B test
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

# ---------- FRONTEND (React / npm) ----------

frontend:build:
  stage: build
  image: node:20
  cache:
    key: npm-frontend
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm
    - npm run build

frontend:lint:
  stage: test
  image: node:20
  cache:
    key: npm-frontend
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm
    - npm run lint