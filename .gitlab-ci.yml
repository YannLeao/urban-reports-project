stages:
  - build
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/backend/.m2/repository"

# ---------- BACKEND (Java / Maven) ----------

backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-backend
    paths:
      - backend/.m2/repository
  script:
    - cd backend
    - ./mvnw -B compile
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key: maven-backend
    paths:
      - backend/.m2/repository
  needs:
    - backend:build
  script:
    - cd backend
    - ./mvnw -B test
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

# ---------- FRONTEND (React / pnpm) ----------

.frontend:
  image: node:22.23.2
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - frontend/.pnpm-store/
  before_script:
    - cd frontend
    - npm install --global "$(node -p 'require("./package.json").packageManager')"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - frontend/**/*
        - docs/design-system/**/*
        - .dockerignore
        - docker-compose.yml
        - .gitlab-ci.yml

frontend:build:
  extends: .frontend
  stage: build
  script:
    - node scripts/build-ci.ts
    - node scripts/package-vercel.ts
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/.vercel/output/
      - frontend/.vercel/artifact.json

frontend:lint:
  extends: .frontend
  stage: test
  needs:
    - frontend:build
  script:
    - pnpm run lint
    - pnpm run typecheck
    - pnpm test

frontend:deploy:
  extends: .frontend
  stage: deploy
  resource_group: production-frontend
  interruptible: false
  needs:
    - job: frontend:build
      artifacts: true
    - job: frontend:lint
      artifacts: false
  script:
    - node scripts/deploy-vercel.ts
  environment:
    name: production/frontend
    url: $FRONTEND_PRODUCTION_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - frontend/**/*
        - docs/design-system/**/*
        - .dockerignore
        - docker-compose.yml
        - .gitlab-ci.yml
      when: manual
      allow_failure: false

# ---------- DEPLOY (Render) ----------

backend:deploy:
  stage: deploy
  image: curlimages/curl:8.22.0
  needs:
    - backend:build
    - backend:test
  script:
    - curl --fail --show-error --silent --get --data-urlencode "ref=$CI_COMMIT_SHA" --output /dev/null "$RENDER_DEPLOY_HOOK"
  environment:
    name: production
    url: $BACKEND_PRODUCTION_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: false
