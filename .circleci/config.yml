version: 2.1

jobs:
  frontend:
    docker:
      - image: node:22.23.2
    working_directory: ~/project
    environment:
      VITE_API_URL: http://localhost:8080
    steps:
      - checkout
      - run:
          name: Install frontend dependencies
          working_directory: ~/project/frontend
          command: |
            node --version
            test "$(node --version)" = "v$(cat .node-version)"
            npm install --global "$(node -p 'require("./package.json").packageManager')"
            pnpm --version
            pnpm install --frozen-lockfile
      - run:
          name: Validate frontend
          working_directory: ~/project/frontend
          command: |
            pnpm run lint
            pnpm run typecheck
            pnpm test
            # Reuse the validation build with the local API URL; no publishing.
            node scripts/build-ci.ts

  backend:
    machine:
      image: ubuntu-2404:2026.10.1
    resource_class: medium
    working_directory: ~/project
    environment:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    steps:
      - checkout
      - run:
          name: Prepare Java 21 and native video tools
          command: |
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends openjdk-21-jdk-headless ffmpeg
            /usr/bin/ffmpeg -version
            /usr/bin/ffprobe -version
            docker info
      - run:
          name: Verify backend with disposable Testcontainers services
          working_directory: ~/project/backend
          command: |
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            ./mvnw -version
            ./mvnw -B verify

workflows:
  validation:
    jobs:
      - frontend
      - backend
