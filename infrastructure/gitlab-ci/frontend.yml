.frontend:
  image: node:22.23.2
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - frontend/.pnpm-store/
  before_script:
    - cd frontend
    - npm install --global "$(node -p 'require("./package.json").packageManager')"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - frontend/**/*
        - docs/design-system/**/*
        - .dockerignore
        - docker-compose.yml
        - .gitlab-ci.yml
        - infrastructure/gitlab-ci/frontend.yml

frontend:build:
  extends: .frontend
  stage: build
  script:
    - node scripts/build-ci.ts
    - node scripts/package-vercel.ts
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/.vercel/output/
      - frontend/.vercel/artifact.json

frontend:lint:
  extends: .frontend
  stage: test
  needs:
    - frontend:build
  script:
    - pnpm run lint
    - pnpm run typecheck
    - pnpm test

frontend:deploy:
  extends: .frontend
  stage: deploy
  resource_group: production-frontend
  interruptible: false
  needs:
    - job: frontend:build
      artifacts: true
    - job: frontend:lint
      artifacts: false
  script:
    - node scripts/deploy-vercel.ts
  environment:
    name: production/frontend
    url: $FRONTEND_PRODUCTION_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - frontend/**/*
        - docs/design-system/**/*
        - .dockerignore
        - docker-compose.yml
        - .gitlab-ci.yml
        - infrastructure/gitlab-ci/frontend.yml
      when: manual
      allow_failure: false
