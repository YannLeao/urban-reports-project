server {
    listen 80;
    server_name _;

    # TLS is terminated by the public load balancer or CDN.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}